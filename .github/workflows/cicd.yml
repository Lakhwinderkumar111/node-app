name: Deploy Node Application

on: 
  push:
    branches:
      - mern-dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASS }}     
      - name: Build Docker Image
        run: docker build -t lakhwinderkumar/nodejs-repo:latest .
      - name: Publish Image to docker hub
        run: docker push lakhwinderkumar/nodejs-repo:latest 
 
     deploy:
  needs: build
  runs-on: self-hosted
  steps:
    - name: Pull latest image
      run: sudo docker pull lakhwinderkumar/nodejs-repo:latest

    - name: Remove old container
      run: sudo docker rm -f nodejs-app-container || true  

    - name: Run new container
      run: sudo docker run -d -p 4000:4000 --name nodejs-app-container -e MONGO_PASSWORD='${{ secrets.MONGODBPASS }}' lakhwinderkumar/nodejs-repo:latest
