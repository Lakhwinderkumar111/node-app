name: Deploy Node Application

on: 
  push:
    branches:
      - mern-dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t lakhwinderkumar/nodejs-repo:latest .

      - name: Push Docker Image
        run: docker push lakhwinderkumar/nodejs-repo:latest
 
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull latest image from Docker Hub
        run: docker pull lakhwinderkumar/nodejs-repo:latest

      - name: Remove old container (ignore error if not exists)
        run: docker rm -f nodejs-app-container || true  

      - name: Run new container
        run: docker run -d -p 4000:4000 --name nodejs-app-container -e MONGO_PASSWORD='${{ secrets.MONGODBPASS }}' lakhwinderkumar/nodejs-repo:latest
